name: Access PR Code and Analyze

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  analyze_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get PR number
        id: get_pr
        run: echo "PR_NUMBER=$(echo ${{ github.event.pull_request.number }})" >> $GITHUB_ENV

      - name: Get latest commit ID
        id: get_commit
        run: echo "LATEST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Get diff files
        id: diff_files
        run: |
          echo "DIFF_FILES=$(git diff --name-only origin/${{ github.base_ref }}...origin/${{ github.head_ref }} | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Print debug info
        run: |
          echo "PR number: $PR_NUMBER"
          echo "Latest commit ID: $LATEST_COMMIT"
          echo "Diff files: $DIFF_FILES"

      - name: Analyze each changed file
        run: |
          IFS=',' read -ra FILES <<< "$DIFF_FILES"
          for file in "${FILES[@]}"; do
            echo "Processing file: $file"
            response=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" \
              -d "{\"file_path\": \"$file\", \"commit_id\": \"$LATEST_COMMIT\"}")
            echo "API Response for $file: $response"

            count=$(echo "$response" | jq '.issues | length')
            if [ "$count" -gt 0 ]; then
              for ((i=0; i<count; i++)); do
                line=$(echo "$response" | jq ".issues[$i].line")
                column=$(echo "$response" | jq ".issues[$i].column")
                message=$(echo "$response" | jq -r ".issues[$i].message")
                type=$(echo "$response" | jq -r ".issues[$i].type")

                # Format message for global comment if line not in diff
                if ! grep -q "$file:$line" <<< "$DIFF_FILES"; then
                  body="In **$file:$line** — **$type** from bot: $message"
                  curl -s -X POST \
                    -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
                    -d "{\"body\": \"$body\"}"
                fi
              done
            fi
          done
        env:
          API_URL: "https://3899-154-124-39-72.ngrok-free.app/analyze/code"
          PR_NUMBER: ${{ env.PR_NUMBER }}
          LATEST_COMMIT: ${{ env.LATEST_COMMIT }}
          DIFF_FILES: ${{ env.DIFF_FILES }}
