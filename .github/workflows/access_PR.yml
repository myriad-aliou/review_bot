name: PR File Analysis
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          # Utiliser git diff pour obtenir les fichiers modifiés
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Stocker les fichiers dans GITHUB_OUTPUT pour les étapes suivantes
          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Analyze files and post review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://3899-154-124-39-72.ngrok-free.app/analyze/code"
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_ID="${{ github.event.pull_request.head.sha }}"
          
          echo "Processing PR #$PR_NUMBER"
          echo "Latest commit ID: $COMMIT_ID"
          echo "Repository: $REPO"
          
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed in this PR"
            exit 0
          fi

          # Extensions à ignorer
          IGNORE_EXTENSIONS=("deb" "zip" "pdf" "png" "jpg" "jpeg" "gif" "exe" "dll" "so" "dylib" "mp4" "mp3" "avi" "mov")

          echo "$CHANGED_FILES" | while IFS= read -r FILE; do
            if [ -z "$FILE" ]; then
              continue
            fi

            # Vérifier que le fichier existe et est un fichier normal
            if [ ! -f "$FILE" ]; then
              echo "Skipping $FILE (not a regular file or doesn't exist)"
              continue
            fi

            # Extraire l'extension du fichier (en minuscule)
            EXT="${FILE##*.}"
            EXT="${EXT,,}"

            # Vérifier si l'extension est dans la liste d'extensions à ignorer
            SKIP_FILE=false
            for IGN_EXT in "${IGNORE_EXTENSIONS[@]}"; do
              if [ "$EXT" = "$IGN_EXT" ]; then
                SKIP_FILE=true
                break
              fi
            done

            if $SKIP_FILE; then
              echo "Skipping binary or non-code file: $FILE"
              continue
            fi

            # Optionnel : détecter automatiquement si fichier binaire avec la commande file
            if file "$FILE" | grep -qE 'binary|compressed|archive'; then
              echo "Skipping detected binary/compressed file: $FILE"
              continue
            fi

            echo "Processing file: $FILE"

            # Lire le contenu et l'échapper en JSON
            if ! FILE_CONTENT=$(jq -Rs . < "$FILE" 2>/dev/null); then
              echo "Error: Could not read or process file $FILE"
              continue
            fi

            JSON_PAYLOAD=$(jq -n \
              --argjson code "$FILE_CONTENT" \
              --arg filename "$FILE" \
              '{code: $code, filename: $filename}')

            echo "Sending analysis request for $FILE..."

            if RESPONSE=$(curl -s -w "%{http_code}" -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --connect-timeout 30 \
              --max-time 60 \
              -d "$JSON_PAYLOAD"); then
              
              HTTP_CODE="${RESPONSE: -3}"
              RESPONSE_BODY="${RESPONSE%???}"

              echo "HTTP Status: $HTTP_CODE"

              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "API Response for $FILE:"
                echo "$RESPONSE_BODY"

                if ISSUES=$(echo "$RESPONSE_BODY" | jq -r '.issues // [] | if type == "array" then . else [] end' 2>/dev/null); then
                  ISSUE_COUNT=$(echo "$ISSUES" | jq 'length' 2>/dev/null || echo "0")

                  if [ "$ISSUE_COUNT" -gt 0 ]; then
                    echo "Found $ISSUE_COUNT issues for $FILE"
                    
                    echo "$ISSUES" | jq -r '.[] | @base64' | while IFS= read -r ISSUE_B64; do
                      if [ -n "$ISSUE_B64" ]; then
                        ISSUE_JSON=$(echo "$ISSUE_B64" | base64 -d)

                        LINE=$(echo "$ISSUE_JSON" | jq -r '.line // 1')
                        MESSAGE=$(echo "$ISSUE_JSON" | jq -r '.message // "Unknown issue"')
                        TYPE=$(echo "$ISSUE_JSON" | jq -r '.type // "info"')
                        SOURCE=$(echo "$ISSUE_JSON" | jq -r '.source // "analyzer"')

                        if [ "$LINE" -le 0 ]; then
                          LINE=1
                        fi

                        COMMENT_BODY="**${TYPE^^}** from $SOURCE: $MESSAGE"
                        echo "Adding comment at $FILE:$LINE"

                        COMMENT_RESPONSE=$(curl -s -w "%{http_code}" -X POST \
                          -H "Authorization: token $GITHUB_TOKEN" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -H "Content-Type: application/json" \
                          "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/comments" \
                          -d "$(jq -n \
                            --arg body "$COMMENT_BODY" \
                            --arg commit_id "$COMMIT_ID" \
                            --arg path "$FILE" \
                            --argjson line "$LINE" \
                            '{body: $body, commit_id: $commit_id, path: $path, line: $line}')")

                        COMMENT_HTTP_CODE="${COMMENT_RESPONSE: -3}"

                        if [ "$COMMENT_HTTP_CODE" -eq 201 ]; then
                          echo "✓ Comment posted successfully"
                        else
                          echo "✗ Failed to post comment (HTTP $COMMENT_HTTP_CODE)"
                          echo "${COMMENT_RESPONSE%???}"
                        fi
                      fi
                    done
                  else
                    echo "No issues found for $FILE"
                  fi
                else
                  echo "Error: Could not parse issues from API response for $FILE"
                fi
              else
                echo "Error: API request failed for $FILE (HTTP $HTTP_CODE)"
                echo "$RESPONSE_BODY"
              fi
            else
              echo "Error: Could not connect to API for $FILE"
            fi

            echo "-----------------------------------"
          done

      - name: Add summary comment
        if: always()
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## 🔍 Code Analysis Summary
            
            Automated code analysis has been completed for all changed files in this PR.
            
            - **Analysis Tools**: Static analysis, security scanning, and AI-powered code review
            - **Files Processed**: Check the inline comments above for detailed findings
            - **Status**: ${{ job.status }}
            
            > 💡 **Tip**: Review the inline comments for specific suggestions and improvements.
            
            ---
            *This analysis was performed automatically on commit ${{ github.event.pull_request.head.sha }}*
          comment_tag: code-analysis-summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}