name: PR File Analysis
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to ensure we can access the changed files
      
      - name: Get changed files since last analysis
        id: changed-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          # Get the current commit SHA
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current commit: $CURRENT_COMMIT"
          
          # Try to get previously analyzed commit from PR comments
          PREV_ANALYZED_COMMIT=$(gh pr view $PR_NUMBER --json comments --jq '.comments[] | select(.body | contains("Analyzed up to commit:")) | .body' | grep -o 'Analyzed up to commit: [0-9a-f]\+' | tail -1 | awk '{print $4}')
          
          if [ -z "$PREV_ANALYZED_COMMIT" ]; then
            # First analysis in this PR - get base commit (start of PR)
            echo "No previous analysis found - analyzing all files from PR base"
            BASE_COMMIT=$(git merge-base $CURRENT_COMMIT origin/${{ github.base_ref }})
            CHANGED_FILES=$(git diff --name-only $BASE_COMMIT $CURRENT_COMMIT)
          else
            # Get only files changed since the last analyzed commit
            echo "Found previous analysis at commit: $PREV_ANALYZED_COMMIT"
            CHANGED_FILES=$(git diff --name-only $PREV_ANALYZED_COMMIT $CURRENT_COMMIT)
          fi
          
          # Output changed files for debugging
          echo "Files changed since last analysis:"
          echo "$CHANGED_FILES"
          
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Store current commit for reference in later steps
          echo "CURRENT_COMMIT=$CURRENT_COMMIT" >> $GITHUB_ENV
      
      - name: Analyze files and post review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://d3f6-41-82-199-251.ngrok-free.app/analyze/code"
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_ID=${{ env.CURRENT_COMMIT }}
          
          echo "Using commit ID for comments: $COMMIT_ID"
          
          # Check if there are any files to analyze
          if [ -z "$CHANGED_FILES" ]; then
            echo "No new or modified files to analyze"
            exit 0
          fi
          
          # Process each file individually
          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              echo "Processing file: $FILE"
              # Get file content and escape properly for JSON
              FILE_CONTENT=$(cat "$FILE" | jq -Rs .)
              # Create JSON payload for this file
              JSON_PAYLOAD="{\"code\": $FILE_CONTENT, \"filename\": \"$FILE\"}"
              echo "Sending request for $FILE..."
              
              # Send to API and capture response
              RESPONSE=$(curl -s -X POST "$API_URL" \
                -H "Content-Type: application/json" \
                -d "$JSON_PAYLOAD")
                
              echo "API Response for $FILE:"
              echo "$RESPONSE"
              
              # Parse issues from the response
              ISSUES=$(echo "$RESPONSE" | jq -r '.issues // []')
              
              # If there are issues, create comments for each
              if [[ "$ISSUES" != "[]" && "$ISSUES" != "null" ]]; then
                # Count issues
                ISSUE_COUNT=$(echo "$ISSUES" | jq 'length')
                echo "Found $ISSUE_COUNT issues for $FILE"
                
                # Create a review comment for each issue
                for (( i=0; i<$ISSUE_COUNT; i++ )); do
                  LINE=$(echo "$ISSUES" | jq -r ".[$i].line")
                  MESSAGE=$(echo "$ISSUES" | jq -r ".[$i].message")
                  TYPE=$(echo "$ISSUES" | jq -r ".[$i].type")
                  SOURCE=$(echo "$ISSUES" | jq -r ".[$i].source")
                  
                  # Create the review comment using the GitHub REST API
                  COMMENT_BODY="**$TYPE** from $SOURCE: $MESSAGE"
                  
                  echo "Adding comment at $FILE:$LINE - $COMMENT_BODY"
                  
                  # Use GitHub REST API to post the review comment
                  curl -s -X POST \
                    -H "Authorization: token $GITHUB_TOKEN" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/comments" \
                    -d "{
                      \"body\": \"$COMMENT_BODY\",
                      \"commit_id\": \"$COMMIT_ID\",
                      \"path\": \"$FILE\",
                      \"line\": $LINE
                    }"
                done
              else
                # No issues detected, add a general comment
                echo "No specific issues found for $FILE"
              fi
              
              echo "-----------------------------------"
            fi
          done
          
      - name: Add summary comment with tracking information
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            # Code Analysis Summary
            
            Analysis completed for recently changed files. See inline comments for details.
            
            Analyzed up to commit: ${{ env.CURRENT_COMMIT }}
            
            *Automated analysis performed on changed files*
          comment_tag: code-analysis-summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}